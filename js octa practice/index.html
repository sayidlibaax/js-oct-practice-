    <script>
        let i = 0;

while (i < 5) {
  const answer = prompt("Guess the number (you have 5 attempts):");
  if (answer === null) break;
  const number = Number(answer);
  if (answer.trim() === "" || !Number.isFinite(number)) {
    console.log("Enter a valid number.");
    continue;
  }
  i++;

  if (number === 15) {
    console.log("Correct!");
    break;
  } else if (number < 15) {
    console.log("low");
  } else {
    console.log("high");
  }
}
// JavaScript Chapter 2 — Questions 1 to 21
// Each question is separated by a comment.
// Open this HTML file in a browser and view results in its developer console.

async function ask(question) {
  const answer = window.prompt(question);
  if (answer === null) throw new Error("Exercise cancelled.");
  return answer.trim();
}

async function askNumber(question) {
  while (true) {
    const answer = await ask(question);
    const number = Number(answer);
    if (answer !== "" && Number.isFinite(number)) return number;
    console.log("Enter a valid number.");
  }
}

}

// Q14 — Weekly Sales (For Loop)

  }

  console.log(`Total sales for the week: ${totalSales}`);
}

// Q18 — Customer Data Entry (Do...While Loop)
// Enter -1 to stop entering amounts.
async function q18() {
  let total = 0;
  let amount;

  do {
    amount = await askNumber("Enter a purchase amount (-1 to stop): ");

    if (amount >= 0) {
      total += amount;
    }
  } while (amount !== -1);

  console.log(`Total purchases: ${total}`);
}

// Q20 — Classroom Seating Pattern (Nested Loops)
async function q20() {
  for (let row = 1; row <= 5; row++) {
    let seats = "";

    for (let seat = 1; seat <= 6; seat++) {
      seats += `[R${row}-S${seat}] `;
    }

    console.log(seats);
  }
}

// Q21 — Mini School Management System
// Assumption: exam eligibility requires attendance >= 75% and mark >= 50.
async function q21() {
  const classMarks = [[], []];
  let choice;

  do {
    console.log("\n1 = Enter Student Result");
    console.log("2 = Check Attendance");
    console.log("3 = Display Grade Statistics");
    console.log("4 = Exit");

    choice = await askNumber("Choose an option: ");

    switch (choice) {
      case 1: {
        const mark = await askNumber("Enter the mark (0 to 100): ");

        if (mark < 0 || mark > 100) {
          console.log("Invalid mark. Try again.");
          continue;
        }

        const classNumber = await askNumber("Enter class number 1 or 2: ");

        if (classNumber !== 1 && classNumber !== 2) {
          console.log("Enter class 1 or 2.");
          continue;
        }

        classMarks[classNumber - 1].push(mark);
        console.log("The result has been saved.");
        break;
      }

      case 2: {
        const mark = await askNumber("Enter the student's mark: ");
        const attendance = await askNumber("Enter attendance percentage: ");

        if (attendance >= 75 && mark >= 50) {
          console.log("The student is eligible to sit for the examination.");
        } else {
          console.log("The student is not eligible to sit for the examination.");
        }
        break;
      }

      case 3: {
        // Outer loop: classes. Inner loop: marks in each class.
        for (let c = 0; c < classMarks.length; c++) {
          let total = 0;

          for (let s = 0; s < classMarks[c].length; s++) {
            total += classMarks[c][s];
          }

          const count = classMarks[c].length;
          const average = count === 0 ? 0 : total / count;

          console.log(
            `Class ${c + 1}: students ${count}, average ${average}`
          );
        }
        break;
      }

      case 4:
        console.log("The program has ended.");
        break;

      default:
        console.log("Invalid option. Choose 1 to 4.");
    }
  } while (choice !== 4);
}

// Enter 0 to run all questions, or 1 to 21 to run one question.
async function main() {
  const questions = [
    q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11,
    q12, q13, q14, q15, q16, q17, q18, q19, q20, q21
  ];

  const number = await askNumber("Enter 0 for all questions, or enter a question number 1 to 21: ");

  if (number === 0) {
    for (let i = 0; i < questions.length; i++) {
      console.log(`\n========== QUESTION ${i + 1} ==========`);
      await questions[i]();
    }
  } else if (Number.isInteger(number) && number >= 1 && number <= 21) {
    await questions[number - 1]();
  } else {
    console.log("Choose a number from 0 to 21.");
  }

}

main().catch((error) => console.log(error.message));
